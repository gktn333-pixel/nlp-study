    // ==========================================
    // 7. AtomTutor-Inspired Quiz System (300 MCQs, Chapter Filter, Stats, Option Shuffle)
    // ==========================================
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getScopedQuestions() {
      if (state.quizScope === 'all') return quizData;
      return quizData.filter(q => q.ch === state.quizScope);
    }

    window.updateQuizConfig = (key, val) => {
      state[key] = key === 'quizCount' && val !== 'all' ? Number(val) : val;
      state.quizActive = false;
      renderMain();
    };

    window.startQuizSession = () => {
      const pool = getScopedQuestions();
      if (pool.length === 0) return;

      const unsolved = pool.filter(q => !savedQuizHistory[q.id]);
      const wrong = pool.filter(q => savedQuizHistory[q.id] === 'wrong');
      const solvedCorrect = pool.filter(q => savedQuizHistory[q.id] === 'correct');

      let ordered = [];
      if (state.quizPriority === 'unsolved') {
        ordered = [...shuffleArray(unsolved), ...shuffleArray(wrong), ...shuffleArray(solvedCorrect)];
      } else if (state.quizPriority === 'wrong') {
        ordered = [...shuffleArray(wrong), ...shuffleArray(unsolved), ...shuffleArray(solvedCorrect)];
      } else {
        ordered = shuffleArray(pool);
      }

      const targetCount = state.quizCount === 'all' ? ordered.length : Math.min(state.quizCount, ordered.length);
      const selected = ordered.slice(0, targetCount);

      state.quizSession = selected.map(item => {
        const mappedOptions = item.options.map((optText, idx) => ({
          text: optText,
          isCorrect: idx === item.answer
        }));
        return {
          ...item,
          shuffledOptions: shuffleArray(mappedOptions),
          selectedIdx: null
        };
      });

      state.quizCurrentIdx = 0;
      state.quizActive = true;
      renderMain();
    };

    window.selectSessionOption = (qIdx, oIdx) => {
      const qObj = state.quizSession[qIdx];
      if (qObj.selectedIdx !== null) return; // Prevent changing after answer
      qObj.selectedIdx = oIdx;

      const isRight = qObj.shuffledOptions[oIdx].isCorrect;
      savedQuizHistory[qObj.id] = isRight ? 'correct' : 'wrong';
      localStorage.setItem('nlp_quiz_history', JSON.stringify(savedQuizHistory));

      renderMain();
    };

    window.resetQuizHistory = () => {
      const pool = getScopedQuestions();
      pool.forEach(q => {
        delete savedQuizHistory[q.id];
      });
      localStorage.setItem('nlp_quiz_history', JSON.stringify(savedQuizHistory));
      state.quizActive = false;
      renderMain();
    };

    window.exitQuizSession = () => {
      state.quizActive = false;
      renderMain();
    };

    function renderQuizView() {
      const pool = getScopedQuestions();
      const totalCount = pool.length;
      const unsolvedCount = pool.filter(q => !savedQuizHistory[q.id]).length;
      const wrongCount = pool.filter(q => savedQuizHistory[q.id] === 'wrong').length;
      const scopeLabel = state.quizScope === 'all'
        ? '★ 과목 종합 (01강 ~ 15강)'
        : `${courseData.find(c => c.id === state.quizScope).num} · ${courseData.find(c => c.id === state.quizScope).title}`;

      // Top AtomTutor-style Control Bar
      const controlBarHtml = `
        <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-3">
          <div class="flex flex-wrap items-center gap-2">
            <!-- Scope Selector -->
            <select
              onchange="updateQuizConfig('quizScope', this.value)"
              class="flex-1 min-w-[180px] px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
              <option value="all" ${state.quizScope === 'all' ? 'selected' : ''}>★ 과목 종합 (전체 ${quizData.length}문항)</option>
              ${courseData.map(ch => {
                const cnt = quizData.filter(q => q.ch === ch.id).length;
                return `
                  <option value="${ch.id}" ${state.quizScope === ch.id ? 'selected' : ''}>
                    ${ch.num} · ${ch.title} (${cnt}문항)
                  </option>
                `;
              }).join('')}
            </select>

            <!-- Count Selector -->
            <select
              onchange="updateQuizConfig('quizCount', this.value)"
              class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
              <option value="5" ${state.quizCount === 5 ? 'selected' : ''}>5문항</option>
              <option value="10" ${state.quizCount === 10 ? 'selected' : ''}>10문항</option>
              <option value="20" ${state.quizCount === 20 ? 'selected' : ''}>20문항</option>
              <option value="40" ${state.quizCount === 40 ? 'selected' : ''}>40문항</option>
              <option value="all" ${state.quizCount === 'all' ? 'selected' : ''}>범위 전체 (${totalCount}문항)</option>
            </select>

            <!-- Type Badge (Fixed 4-choice MCQ as requested) -->
            <div class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-100/70 dark:bg-slate-800/60 text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300">
              사지선다 전용
            </div>

            <!-- Priority Selector -->
            <select
              onchange="updateQuizConfig('quizPriority', this.value)"
              class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
              <option value="unsolved" ${state.quizPriority === 'unsolved' ? 'selected' : ''}>안 푼 것 먼저</option>
              <option value="wrong" ${state.quizPriority === 'wrong' ? 'selected' : ''}>틀린 것 먼저</option>
              <option value="random" ${state.quizPriority === 'random' ? 'selected' : ''}>전체 랜덤</option>
            </select>

            <!-- Start Button -->
            <button
              onclick="startQuizSession()"
              class="px-5 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-sm shadow-sm flex items-center gap-1.5 transition cursor-pointer"
            >
              <i data-lucide="play" class="w-4 h-4 fill-current"></i> 시작
            </button>
          </div>
        </div>
      `;

      // Lobby Dashboard (when not actively solving)
      if (!state.quizActive) {
        contentContainer.innerHTML = `
          <div class="space-y-6">
            ${controlBarHtml}

            <div class="bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-6">
              <div class="flex flex-wrap items-baseline justify-between gap-2">
                <div>
                  <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">${scopeLabel}</h2>
                  <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">자연언어처리 · 강의당 20문항 (총 300문항) 사지선다 개념 퀴즈</p>
                </div>
                <button
                  onclick="resetQuizHistory()"
                  class="text-xs px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                >
                  이 범위 풀이 기록 초기화
                </button>
              </div>

              <!-- 3 Stat Cards (AtomTutor style) -->
              <div class="grid grid-cols-3 gap-3 sm:gap-5">
                <div class="p-4 sm:p-6 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200/80 dark:border-slate-700 text-center">
                  <div class="text-2xl sm:text-4xl font-extrabold text-slate-900 dark:text-white">${totalCount}</div>
                  <div class="text-xs sm:text-sm font-medium text-slate-500 dark:text-slate-400 mt-1.5">전체 문항</div>
                </div>
                <div class="p-4 sm:p-6 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200/80 dark:border-slate-700 text-center">
                  <div class="text-2xl sm:text-4xl font-extrabold text-indigo-600 dark:text-indigo-400">${unsolvedCount}</div>
                  <div class="text-xs sm:text-sm font-medium text-slate-500 dark:text-slate-400 mt-1.5">안 푼 문항</div>
                </div>
                <div class="p-4 sm:p-6 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200/80 dark:border-slate-700 text-center">
                  <div class="text-2xl sm:text-4xl font-extrabold text-rose-600 dark:text-rose-400">${wrongCount}</div>
                  <div class="text-xs sm:text-sm font-medium text-slate-500 dark:text-slate-400 mt-1.5">틀린 문항</div>
                </div>
              </div>

              <p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed bg-slate-50 dark:bg-slate-800/40 p-4 rounded-xl border border-slate-100 dark:border-slate-800">
                위쪽 메뉴에서 <strong>강의 범위 · 문항 수 · 출제 기준</strong>을 고르고 <strong>‘▶ 시작’</strong>을 누르세요.<br/>
                모든 문제는 OX 없이 <strong>사지선다형</strong>으로만 출제되며, 시작할 때마다 안 푼 문제(또는 틀린 문제)부터 새로 뽑고 <strong>보기 순서도 매번 무작위로 섞입니다.</strong>
              </p>

              <!-- Per-Lecture Quick Grid -->
              <div class="pt-2">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">강의별 문항(각 20문항) 및 풀이 현황 바로가기</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5">
                  ${courseData.map(ch => {
                    const chQs = quizData.filter(q => q.ch === ch.id);
                    const chSolved = chQs.filter(q => savedQuizHistory[q.id] === 'correct').length;
                    const chWrong = chQs.filter(q => savedQuizHistory[q.id] === 'wrong').length;
                    return `
                      <button
                        onclick="updateQuizConfig('quizScope', '${ch.id}'); updateQuizConfig('quizCount', 20); startQuizSession();"
                        class="text-left p-3 rounded-xl border border-slate-200 dark:border-slate-800 hover:border-indigo-400 dark:hover:border-indigo-600 bg-white dark:bg-slate-900/80 hover:bg-indigo-50/40 dark:hover:bg-indigo-950/30 transition flex items-center justify-between gap-2"
                      >
                        <div class="truncate">
                          <div class="text-xs font-bold text-indigo-600 dark:text-indigo-400">${ch.num}</div>
                          <div class="text-sm font-semibold text-slate-800 dark:text-slate-200 truncate">${ch.title}</div>
                        </div>
                        <div class="text-right shrink-0 text-xs">
                          <span class="font-bold text-emerald-600 dark:text-emerald-400">${chSolved}</span>/${chQs.length}
                          ${chWrong > 0 ? `<div class="text-[11px] text-rose-500">오답 ${chWrong}</div>` : ''}
                        </div>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>
          </div>
        `;
        return;
      }

      // Active Quiz Session View
      const sessionTotal = state.quizSession.length;
      const sessionAnswered = state.quizSession.filter(q => q.selectedIdx !== null).length;
      const sessionCorrect = state.quizSession.filter(q => q.selectedIdx !== null && q.shuffledOptions[q.selectedIdx].isCorrect).length;

      contentContainer.innerHTML = `
        <div class="space-y-6">
          ${controlBarHtml}

          <!-- Session Status Bar -->
          <div class="bg-indigo-600 text-white p-4 sm:p-5 rounded-2xl shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div>
              <div class="text-xs text-indigo-200 font-medium">${scopeLabel} · 실전 풀이 중</div>
              <div class="text-lg font-bold mt-0.5">진행률 ${sessionAnswered} / ${sessionTotal}문항 · 현재 정답 ${sessionCorrect}개</div>
            </div>
            <button
              onclick="exitQuizSession()"
              class="px-3.5 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-white text-xs sm:text-sm font-semibold transition"
            >
              대시보드로 돌아가기
            </button>
          </div>

          <!-- Question Cards -->
          ${state.quizSession.map((item, qIdx) => {
            const isAnswered = item.selectedIdx !== null;
            const chInfo = courseData.find(c => c.id === item.ch);
            const isUserCorrect = isAnswered && item.shuffledOptions[item.selectedIdx].isCorrect;

            return `
              <div class="bg-white dark:bg-slate-900 p-5 sm:p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                <div class="flex items-center justify-between gap-2">
                  <div class="flex items-center gap-2">
                    <span class="px-2.5 py-0.5 text-xs font-bold rounded-md bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300">Q${qIdx + 1}</span>
                    <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">${chInfo.num} · ${chInfo.title}</span>
                  </div>
                  ${isAnswered ? `
                    <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${isUserCorrect ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300' : 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300'}">
                      ${isUserCorrect ? '정답' : '오답'}
                    </span>
                  ` : ''}
                </div>

                <p class="font-bold text-base sm:text-[17px] leading-relaxed text-slate-900 dark:text-white">${item.q}</p>

                <div class="space-y-2.5">
                  ${item.shuffledOptions.map((opt, oIdx) => {
                    let btnStyle = 'border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer';
                    if (isAnswered) {
                      if (opt.isCorrect) {
                        btnStyle = 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-900 dark:text-emerald-200 font-semibold';
                      } else if (oIdx === item.selectedIdx) {
                        btnStyle = 'border-rose-500 bg-rose-50 dark:bg-rose-950/40 text-rose-900 dark:text-rose-200';
                      } else {
                        btnStyle = 'border-slate-200 dark:border-slate-800 opacity-55';
                      }
                    }
                    return `
                      <button
                        onclick="selectSessionOption(${qIdx}, ${oIdx})"
                        ${isAnswered ? 'disabled' : ''}
                        class="w-full text-left p-3.5 rounded-xl border text-sm sm:text-[15px] transition flex items-start gap-3 ${btnStyle}"
                      >
                        <span class="w-6 h-6 rounded-full border flex items-center justify-center text-xs shrink-0 font-bold mt-0.5">${oIdx + 1}</span>
                        <span class="leading-relaxed">${opt.text}</span>
                      </button>
                    `;
                  }).join('')}
                </div>

                ${isAnswered ? `
                  <div class="p-4 rounded-xl text-sm leading-relaxed ${isUserCorrect ? 'bg-emerald-50/80 dark:bg-emerald-950/30 text-emerald-900 dark:text-emerald-200 border border-emerald-200/70 dark:border-emerald-800/50' : 'bg-rose-50/80 dark:bg-rose-950/30 text-rose-900 dark:text-rose-200 border border-rose-200/70 dark:border-rose-800/50'}">
                    <strong>${isUserCorrect ? '✓ 정답입니다!' : '✕ 오답입니다.'}</strong> ${item.explanation}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}

          <div class="flex items-center justify-center gap-3 pt-2 pb-6">
            <button
              onclick="startQuizSession()"
              class="px-6 py-3 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-sm shadow-sm flex items-center gap-2 transition"
            >
              <i data-lucide="rotate-cw" class="w-4 h-4"></i> 새 문제 세트로 다시 시작
            </button>
            <button
              onclick="exitQuizSession()"
              class="px-5 py-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 font-semibold text-sm hover:bg-slate-50 dark:hover:bg-slate-800 transition"
            >
              전체 통계 보기
            </button>
          </div>
        </div>
      `;
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(contentContainer, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false }
          ],
          throwOnError: false
        });
      }
    }

    function renderMain() {
      if (state.mode === 'summary') renderSummaryView();
      else if (state.mode === 'compare') renderCompareView();
      else if (state.mode === 'flashcard') renderFlashcardView();
      else if (state.mode === 'quiz') renderQuizView();

      renderMath();
      lucide.createIcons();
    }

    // ==========================================
    // 8. Event Listeners
    // ==========================================
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        state.mode = tab.dataset.mode;
        document.querySelectorAll('.mode-tab').forEach(t => {
          t.className = 'mode-tab flex items-center gap-1.5 px-3.5 py-1.5 rounded-md font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition whitespace-nowrap';
        });
        tab.className = 'mode-tab active flex items-center gap-1.5 px-3.5 py-1.5 rounded-md font-medium transition whitespace-nowrap bg-indigo-50 text-indigo-700 dark:bg-indigo-950/60 dark:text-indigo-300';
        renderMain();
      });
    });

    function handleSearch(val) {
      state.search = val;
      if (state.mode !== 'summary') {
        state.mode = 'summary';
      }
      renderMain();
    }

    document.getElementById('searchInput').addEventListener('input', e => handleSearch(e.target.value));
    document.getElementById('mobileSearchInput').addEventListener('input', e => handleSearch(e.target.value));

    document.getElementById('blurToggleBtn').addEventListener('click', () => {
      state.blurMode = !state.blurMode;
      const btn = document.getElementById('blurToggleBtn');
      if (state.blurMode) {
        btn.classList.add('bg-indigo-50', 'border-indigo-300', 'text-indigo-700', 'dark:bg-indigo-950', 'dark:border-indigo-700', 'dark:text-indigo-300');
      } else {
        btn.classList.remove('bg-indigo-50', 'border-indigo-300', 'text-indigo-700', 'dark:bg-indigo-950', 'dark:border-indigo-700', 'dark:text-indigo-300');
      }
      renderMain();
    });

    document.getElementById('darkModeBtn').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebarBackdrop');
    function openMobileSidebar() {
      sidebar.classList.remove('-translate-x-full');
      backdrop.classList.remove('hidden');
    }
    function closeMobileSidebar() {
      sidebar.classList.add('-translate-x-full');
      backdrop.classList.add('hidden');
    }
    document.getElementById('mobileMenuBtn').addEventListener('click', openMobileSidebar);
    document.getElementById('closeSidebarBtn').addEventListener('click', closeMobileSidebar);
    backdrop.addEventListener('click', closeMobileSidebar);

    window.addEventListener('DOMContentLoaded', () => {
      renderSidebar();
      renderMain();
    });
  </script>
</body>
</html>
